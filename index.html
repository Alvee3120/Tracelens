<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Trace any reference image onto real paper with your phone camera." />
    <meta name="color-scheme" content="dark light" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TraceLens" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#5eead4" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <title>TraceLens — trace anything onto paper</title>

    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong
      // theme. Falls back to the system preference.
      (function () {
        try {
          var raw = localStorage.getItem('tracelens:settings');
          var parsed = raw ? JSON.parse(raw) : null;
          var theme = (parsed && parsed.state && parsed.state.theme) || 'system';
          var dark =
            theme === 'dark' ||
            (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (error) {
          /* keep the default dark theme */
        }
      })();
    </script>
  </head>
  <body class="bg-ink-900 antialiased">
    <div id="root"></div>
    <noscript>
      <div style="padding: 24px; font-family: system-ui">
        TraceLens needs JavaScript and a camera to run.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
